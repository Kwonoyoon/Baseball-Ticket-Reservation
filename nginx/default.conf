upstream ticketing_backend {
    server backend:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 실시간 알림(SSE). 일반 API와 달리 연결을 오래 열어 두고 이벤트를 바로 흘려보내야 한다.
    # - 버퍼링을 끄지 않으면 알림이 모였다가 늦게 도착한다.
    # - 서버가 연결을 30분 유지하므로(NotificationEmitterRegistry) 그보다 길게 기다린다.
    # - EventSource는 헤더를 못 붙여 URL에 토큰이 실리므로 접근 로그에 남기지 않는다.
    location = /api/notifications/stream {
        proxy_pass http://ticketing_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 35m;
        access_log off;
    }

    # API는 Spring Boot로 프록시한다.
    location /api/ {
        proxy_pass http://ticketing_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Vite 빌드 산출물은 파일명에 해시가 붙으므로 오래 캐시한다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA 라우팅: 존재하지 않는 경로는 index.html로 보낸다.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }
}
