# MySQL/Redis 없이 바로 실행해 볼 수 있는 로컬 프로필 (H2 MySQL 호환 모드 + 메모리 좌석 선점 저장소)
spring:
  datasource:
    url: jdbc:h2:mem:ticketing;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  cache:
    type: simple
  h2:
    console:
      enabled: true

management:
  health:
    redis:
      enabled: false

ticketing:
  seat-hold:
    store: memory
