spring:
  application:
    name: ticketing
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ticketing}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD:ticketing}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  cache:
    type: redis
    redis:
      time-to-live: 10m
      key-prefix: "ticketing:cache:"
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

ticketing:
  jwt:
    # 운영 환경에서는 반드시 JWT_SECRET 환경 변수로 32바이트 이상의 비밀 값을 주입한다.
    secret: ${JWT_SECRET:local-development-only-secret-key-change-me!!}
    access-token-validity: 30m
  auth:
    refresh-token-validity: 7d
    refresh-reuse-grace: 10s
    # HTTPS가 아닌 곳(로컬 개발)에서만 false로 둔다.
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    max-login-failures: 5
  admin:
    # 첫 관리자 계정. 둘 다 설정되어 있고 같은 아이디가 없을 때만 서버 시작 시 만든다.
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
    email: ${ADMIN_EMAIL:}
  notification:
    # redis: 서버가 여러 대여도 모든 서버의 연결로 알림을 보낸다 | local: 이 서버에 연결된 회원에게만 (Redis 없이 실행할 때)
    broadcast: redis
    mail:
      # 알림 메일의 "예매 내역 보기" 링크가 가리킬 프론트엔드 주소
      app-base-url: ${APP_BASE_URL:http://localhost:5173}
  seat-hold:
    # redis | memory
    store: redis
    ttl: 5m
    max-seats: 4
  reservation:
    # 한 회원이 한 경기에서 예매할 수 있는 최대 좌석 수
    max-seats-per-game: 4
  sample-data:
    enabled: ${SAMPLE_DATA_ENABLED:true}
    days: 14
